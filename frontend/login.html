<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log in — YatraSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <div class="eyebrow">YatraSetu</div>
    <h2>Come as a guest.<br/><em>Leave as family.</em></h2>
    <p>Verified local families, personalised matching, and a safety layer that works in both directions.</p>
  </div>

  <div class="auth-form">
    <div class="auth-box">
      <h1 id="title">Welcome back</h1>
      <p class="sub" id="subtitle">Log in with your Digital ID to see your trips and safety settings.</p>

      <form id="authForm" novalidate style="margin-top: 2rem;">
        
        <!-- The single Digital ID input field -->
        <div class="field" id="fDigitalId">
          <label for="digitalId">Digital ID</label>
          <input id="digitalId" type="text" placeholder="e.g. YS-2026-12345" autocomplete="off"/>
          <div class="err">Please enter a valid Digital ID.</div>
        </div>

        <button type="submit" class="btn-solid btn-full" id="submitBtn">Log in</button>
      </form>

      <p class="sub" style="margin-top:1rem;text-align:center">
        <a href="index.html" style="text-decoration:underline">Back to the site</a>
      </p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/mock.js"></script>
<script src="js/session.js"></script>
<script src="js/api.js"></script>
<script>
UI.demoBanner();

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const digitalIdInput = document.getElementById('digitalId').value.trim();
  const fDigitalId = document.getElementById('fDigitalId');
  
  if (digitalIdInput.length < 5) {
    fDigitalId.classList.add('invalid');
    return;
  } else {
    fDigitalId.classList.remove('invalid');
  }

  const btn = document.getElementById('submitBtn');
  UI.busy(btn, true, 'Verifying ID…');

  try {
    // Talk directly to your local Python server's identity route
    const response = await fetch(`http://127.0.0.1:8000/api/identity/login/${digitalIdInput}`);
    
    if (!response.ok) {
        throw new Error('Digital ID not found. Please verify your ID or create a new one on the home page.');
    }
    
    const userData = await response.json();

    // The backend verified it! Save it in the session.
    Session.save("digital-id-token", { 
        id: userData.tourist_id, 
        name: userData.display_name, 
        digital_id: userData.digital_id_code,
        role: 'traveller' 
    });

    UI.toast('Login successful!', 'ok');
    
    setTimeout(() => {
        const next = new URLSearchParams(location.search).get('next');
        window.location.href = next || 'dashboard.html';
    }, 1000);

  } catch (err) {
    UI.toast(err.message, 'alert');
  } finally {
    UI.busy(btn, false);
  }
});
</script>
</body>
</html>
